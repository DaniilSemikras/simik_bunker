<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101716">
    <title>Бункер — игра для друзей</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=20260730-survivor-contributions">
</head>
<body>
    <div class="bunker-backdrop" aria-hidden="true"></div>
    <div id="themeControl" class="theme-control">
        <button id="themeToggle" class="theme-toggle" type="button" title="Выбрать цветовую тему" aria-label="Выбрать цветовую тему" aria-expanded="false"><span id="themeIcon" aria-hidden="true">☀</span><span>Тема</span><span class="theme-chevron" aria-hidden="true">⌄</span></button>
        <div id="themeMenu" class="theme-menu hidden" role="menu" aria-label="Цветовая тема">
            <span class="theme-menu-title">Цветовая тема</span>
            <button type="button" class="theme-option" data-theme-choice="amber" role="menuitem"><i class="theme-swatch amber" aria-hidden="true"></i><span><strong>Янтарь</strong><small>классический бункер</small></span><b aria-hidden="true">✓</b></button>
            <button type="button" class="theme-option" data-theme-choice="radiation" role="menuitem"><i class="theme-swatch radiation" aria-hidden="true"></i><span><strong>Радиация</strong><small>токсичный зелёный свет</small></span><b aria-hidden="true">✓</b></button>
            <button type="button" class="theme-option" data-theme-choice="frost" role="menuitem"><i class="theme-swatch frost" aria-hidden="true"></i><span><strong>Ночной лёд</strong><small>холодный режим</small></span><b aria-hidden="true">✓</b></button>
        </div>
    </div>
    <main class="app-shell">
        <section id="menu" class="panel menu-panel">
            <p class="eyebrow">ИГРА ДЛЯ СИМИКОВ И МИМИКОВ</p>
            <h1>Кто попадет на выплаты, а кто на парашу?<br></h1>
            <label class="field-label" for="nickname">Ваш никнейм</label>
            <input id="nickname" maxlength="18" autocomplete="nickname" placeholder="Например, Мираи">
            <button id="createRoom" class="button primary">Создать комнату</button>
            <div class="or"><span>или</span></div>
            <div class="join-row">
                <input id="roomCode" maxlength="4" autocomplete="off" placeholder="КОД">
                <button id="joinRoom" class="button secondary">Войти</button>
            </div>
        </section>

        <section id="lobby" class="panel hidden">
            <div class="panel-topline"><p class="eyebrow">КОМНАТА</p><button id="leaveLobby" class="text-button">Выйти</button></div>
            <div class="room-code"><span id="roomTitle"></span><button id="copyCode" class="copy-button" title="Скопировать код">⧉</button></div>
            <p id="hostNote" class="hint"></p>
            <div class="lobby-heading"><h2>Игроки</h2><span id="playerCount" class="count"></span></div>
            <div id="players" class="players-list"></div>
            <button id="startGame" class="button primary">Начать игру</button>
            <button id="startSoloTest" class="button secondary hidden" type="button">Тестовый запуск в соло</button>
            <button id="addTestPlayers" class="button debug-button hidden" type="button">+ Добавить 2 тестовых ботов</button>
            <p id="startHint" class="hint centered"></p>
        </section>

        <section id="game" class="game-view hidden">
            <div class="game-header">
                <div><p class="eyebrow">Бункер · <span id="gameCode"></span></p><h2 id="phaseTitle">Подготовка</h2></div>
                <div class="game-actions"><button id="soundToggle" class="sound-button" type="button" aria-pressed="true">🔊 Звук</button><button id="leaveGame" class="text-button">Покинуть</button></div>
            </div>
            <section id="resultsBanner" class="results-banner hidden" aria-live="polite"></section>
            <div class="game-layout">
                <section class="panel round-panel">
                    <p id="roundLabel" class="eyebrow"></p>
                    <div id="timerControls" class="timer-controls hidden">
                        <div id="actionTimer" class="action-timer" aria-live="polite"></div>
                        <button id="extendRoomTimer" class="extend-room-timer hidden" type="button" title="Продлить просмотр результатов на 30 секунд" aria-label="Продлить просмотр результатов на 30 секунд">+30</button>
                    </div>
                    <div class="round-copy">
                        <h3 id="roundTitle"></h3>
                        <p id="roundDescription" class="hint"></p>
                        <p id="actionHint" class="hint"></p>
                    </div>
                    <button id="revealButton" class="button primary">Раскрыть карту</button>
                    <button id="skipVoteButton" class="button skip-vote hidden" type="button">Не исключать никого</button>
                </section>
                <div class="game-main">
                    <div id="disasterCard" class="disaster-card"><span class="eyebrow">КАТАСТРОФА</span><p></p><div class="disaster-meta"><span class="capacity"></span></div></div>
                    <section id="bunkerTraitsPanel" class="panel bunker-traits-panel hidden">
                        <div class="lobby-heading"><h3>Характеристики бункера</h3><span class="count">случайно выбрано</span></div>
                        <div id="bunkerTraits" class="bunker-traits"></div>
                    </section>
                    <section class="panel cards-panel">
                        <div class="lobby-heading"><h3>Мои карты</h3><span class="count">секретно</span></div>
                        <div id="myCards" class="my-cards"></div>
                    </section>
                </div>
                <section class="panel players-panel">
                    <div class="lobby-heading"><h3>Участники</h3><div class="players-heading-actions"><button id="playerViewToggle" class="player-view-toggle" type="button">▦ Таблица</button><span id="survivorCount" class="count"></span></div></div>
                    <div id="gamePlayers" class="game-players"></div>
                </section>
            </div>
            <section class="panel action-log-panel">
                <div class="lobby-heading"><h3>Журнал действий</h3><span class="count">последние события</span></div>
                <ol id="actionLog" class="action-log"></ol>
            </section>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=20260730-survivor-contributions"></script>
</body>
</html>
